name: support-assistant

services:
  redis:
    image: redis:8.8.3-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      application:
        ipv4_address: 172.31.0.4
    restart: unless-stopped

  migrate:
    image: ${BACKEND_IMAGE}
    env_file:
      - path: ${PRODUCTION_ENV_FILE:-.env}
        required: true
    environment:
      DATABASE_URL: sqlite+aiosqlite:////app/data/app.db
      REDIS_URL: redis://redis:6379/0
    volumes:
      - support-assistant-data:/app/data
    command: ["python", "-m", "alembic", "upgrade", "head"]
    networks:
      - application
    restart: "no"

  backend:
    image: ${BACKEND_IMAGE}
    env_file:
      - path: ${PRODUCTION_ENV_FILE:-.env}
        required: true
    environment:
      DATABASE_URL: sqlite+aiosqlite:////app/data/app.db
      REDIS_URL: redis://redis:6379/0
      FORWARDED_ALLOW_IPS: 172.31.0.3
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    volumes:
      - support-assistant-data:/app/data
    expose:
      - "8000"
    networks:
      application:
        ipv4_address: 172.31.0.2
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2)",
        ]
      interval: 15s
      timeout: 3s
      start_period: 15s
      retries: 3
    restart: unless-stopped

  frontend:
    image: ${FRONTEND_IMAGE}
    environment:
      TRUSTED_PROXY_CIDR: ${TRUSTED_PROXY_CIDR}
    depends_on:
      backend:
        condition: service_healthy
    networks:
      application:
        ipv4_address: 172.31.0.3
      proxy:
        aliases:
          - support-assistant-frontend
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 15s
      timeout: 3s
      start_period: 10s
      retries: 3
    restart: unless-stopped

networks:
  application:
    internal: true
    ipam:
      config:
        - subnet: 172.31.0.0/24
  proxy:
    external: true
    name: ${PROXY_NETWORK}

volumes:
  support-assistant-data:
