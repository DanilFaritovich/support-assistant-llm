services:
  redis:
    image: redis:8.8.3-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      default:
        ipv4_address: 172.30.0.4
    restart: unless-stopped

  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - path: ./.env
        required: false
    environment:
      DATABASE_URL: sqlite+aiosqlite:////app/data/app.db
    volumes:
      - support-assistant-data:/app/data
    command: ["python", "-m", "alembic", "upgrade", "head"]
    restart: "no"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - path: ./.env
        required: false
    environment:
      DATABASE_URL: sqlite+aiosqlite:////app/data/app.db
      REDIS_URL: redis://redis:6379/0
      FORWARDED_ALLOW_IPS: 172.30.0.3
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    volumes:
      - support-assistant-data:/app/data
    expose:
      - "8000"
    networks:
      default:
        ipv4_address: 172.30.0.2
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2)",
        ]
      interval: 15s
      timeout: 3s
      start_period: 15s
      retries: 3
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      backend:
        condition: service_healthy
    environment:
      TRUSTED_PROXY_IP: 127.0.0.1
    networks:
      default:
        ipv4_address: 172.30.0.3
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 15s
      timeout: 3s
      start_period: 10s
      retries: 3
    restart: unless-stopped

networks:
  default:
    name: support-assistant-network
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  support-assistant-data:
